<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Empty Bin Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --secondary: #64748b;
      --radius: 12px;
      --shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      background: linear-gradient(135deg, #e0ecff, #f9fafc);
      color: var(--text);
    }

    .card {
      max-width: 900px;
      margin: auto;
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: var(--primary);
    }

    form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
    }

    input {
      flex: 1 1 260px;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid #e2e8f0;
      font-size: 1rem;
    }

    button {
      padding: 12px 18px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    button.primary {
      background: var(--primary);
      color: white;
    }

    button.secondary {
      background: var(--secondary);
      color: white;
    }

    #scannerWrap {
      display: none;
      margin-top: 16px;
      text-align: center;
      padding: 10px;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius);
      background: #f8fafc;
    }

    #binsGrid {
      margin-top: 20px;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }

    .bin-card {
      padding: 16px;
      border-radius: var(--radius);
      font-weight: 600;
      text-align: center;
      background: #f1f5f9;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    .muted {
      color: var(--muted);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Empty Bin Search</h1>

    <form id="searchForm">
      <input id="id" type="text" placeholder="Scan or enter bin ID" autocomplete="off" />
      <button type="submit" class="primary">Search</button>
      <button type="button" id="scanBtn" class="secondary">📷 Scan</button>
    </form>

    <div id="scannerWrap">
      <div id="qr-reader" style="width:300px; margin:auto;"></div>
      <button id="stopScanBtn" type="button" class="secondary" style="margin-top:10px;">Stop camera</button>
    </div>

    <div id="output">
      <div id="binsGrid"></div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- App Logic -->
  <script src="script.js"></script>
</body>
</html>
